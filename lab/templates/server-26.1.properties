# ghast lab, Paper 26.1.2 + GrimAC (template; start.sh copies it into lab/servers/26.1/ on every start)
# Superflat with the same surface as the other labs: grass at y=3, players stand at y=4 (the 26.1
# world starts at y=-64, so stone fills -63..0 below the usual bedrock/dirt/grass stack).
server-port=25626
server-ip=127.0.0.1
online-mode=false
enable-rcon=false
enable-query=false
motd=ghast lab 26.1.2 (Paper + GrimAC)
level-name=world
level-type=minecraft\:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":64},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","features":false,"lakes":false}
level-seed=ghastlab
generate-structures=false
gamemode=survival
force-gamemode=true
difficulty=peaceful
spawn-monsters=false
spawn-animals=false
spawn-npcs=false
spawn-protection=0
allow-flight=true
allow-nether=false
pvp=true
max-players=20
view-distance=8
simulation-distance=8
white-list=false
network-compression-threshold=256
max-tick-time=-1
enforce-secure-profile=false
sync-chunk-writes=false
