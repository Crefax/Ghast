# Oracle configuration for Minecraft 26.1.2 (family check against the 26.1 harness). Everything is downloaded at run time into
# oracle/cache/.

minecraft.version=26.1.2
minecraft.manifest=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# 26.1 ships unobfuscated (the version json has no client_mappings download and the jar's classes carry
# their real names, e.g. net.minecraft.client.player.LocalPlayer). There is nothing to remap: no
# mappings.repo, and the harness compiles against client-official.jar itself.
mappings.to=official

# The jar's classes are Java 25 class files (version json javaVersion.majorVersion = 25). Compilation
# and runs of this version use a Java 25 toolchain (auto-detected or provisioned by Gradle); the other
# versions keep the JDK Gradle runs on.
java.version=25

harness.sourceSet=mc_26_1
harness.mainClass=ghast.oracle.v26_1.Main
