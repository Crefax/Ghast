# Oracle configuration for Minecraft 1.8.6 (family check against the 1.8.9 harness). Everything is
# downloaded at run time into oracle/cache/ (git-ignored); nothing Mojang-derived is ever committed.

minecraft.version=1.8.6
minecraft.manifest=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# Legacy Fabric "Legacy Yarn" (CC0), mergedv2 = official -> intermediary -> named. Pinned; the last
# 1.8.6 build (checked 2026-11-16). Only its official -> intermediary step is used: the names are the
# 1.8.9 row's (mappings.names below).
mappings.repo=https://maven.legacyfabric.net/
mappings.group=net.legacyfabric
mappings.artifact=yarn
mappings.version=1.8.6+build.603
mappings.classifier=mergedv2
mappings.from=official
mappings.to=named
# Member names of the 1.8.9 row, through the intermediary namespace (Setup.java, mappings.names): the
# 1.8.9 harness compiles unchanged and every class both jars share gets the 1.8.9 row's names.
mappings.names=1.8.9

harness.sourceSet=mc_1_8_9
harness.mainClass=ghast.oracle.v1_8_9.Main
# Checked against the 1.8.9 row: writes "1.8.9" headers and compares with tests/golden/1.8.9.
harness.label=1.8.9
