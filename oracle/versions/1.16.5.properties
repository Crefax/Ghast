# Oracle configuration for Minecraft 1.16.5. Everything is downloaded at run time into oracle/cache/.

minecraft.version=1.16.5
minecraft.manifest=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# Fabric Yarn (CC0), mergedv2 = official -> intermediary -> named in one tiny v2 file.
# Pinned; build 10 is the last 1.16.5 build (checked 2026-11-03). Mojang's official mappings are NOT
# used by the oracle (they may not be redistributed); every name in this repository is Yarn.
mappings.repo=https://maven.fabricmc.net/
mappings.group=net.fabricmc
mappings.artifact=yarn
mappings.version=1.16.5+build.10
mappings.classifier=mergedv2
mappings.from=official
mappings.to=named

harness.sourceSet=mc_1_16_5
harness.mainClass=ghast.oracle.v1_16_5.Main

# Some classes have parameter-annotation tables that do not match their descriptor (inner-class
# constructors); javac refuses to compile against them, so the remapped jar drops those tables.
remap.stripParameterAnnotations=true
mappings.vendor=Fabric

# Classes from the single official package end up in different Yarn packages; widen the access flags
# that would otherwise break cross-package protected / package-private calls (e.g. Slot.onTake).
remap.fixPackageAccess=true
