# Oracle configuration for Minecraft 1.8.9.
# Everything listed here is downloaded at run time into oracle/cache/ (git-ignored); nothing
# Mojang-derived is ever committed.

minecraft.version=1.8.9
# Mojang launcher manifest; the version json and client jar are verified by the SHA-1 it lists.
minecraft.manifest=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# Legacy Fabric "Legacy Yarn" (CC0). The mergedv2 artifact carries the namespaces
# official -> intermediary -> named in one tiny v2 file. Pinned for reproducibility; the latest build
# on 2026-11-03 was 604.
mappings.repo=https://maven.legacyfabric.net/
mappings.group=net.legacyfabric
mappings.artifact=yarn
mappings.version=1.8.9+build.604
mappings.classifier=mergedv2
mappings.from=official
mappings.to=named

# Gradle source set holding the harness compiled against this version's named jar.
harness.sourceSet=mc_1_8_9
harness.mainClass=ghast.oracle.v1_8_9.Main
