# Oracle configuration for Minecraft 1.12.2.
# Everything listed here is downloaded at run time into oracle/cache/ (git-ignored); nothing
# Mojang-derived is ever committed.

minecraft.version=1.12.2
# Mojang launcher manifest; the version json and client jar are verified by the SHA-1 it lists.
minecraft.manifest=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# Legacy Fabric "Legacy Yarn" (CC0). The mergedv2 artifact carries the namespaces
# official -> intermediary -> named in one tiny v2 file. Pinned for reproducibility; the latest 1.12.2 build
# on 2026-11-06 was 604.
mappings.repo=https://maven.legacyfabric.net/
mappings.group=net.legacyfabric
mappings.artifact=yarn
mappings.version=1.12.2+build.604
mappings.classifier=mergedv2
mappings.from=official
mappings.to=named

# Gradle source set holding the harness compiled against this version's named jar.
harness.sourceSet=mc_1_12_2
harness.mainClass=ghast.oracle.v1_12_2.Main

# Some classes have parameter-annotation tables that do not match their descriptor (inner-class
# constructors with @Nullable parameters); javac refuses to compile against them, so the remapped jar
# drops those tables (nothing reads them at run time).
remap.stripParameterAnnotations=true

# Classes from the single official package end up in different Yarn packages; widen the access flags
# that would otherwise break cross-package protected / package-private calls at run time (verifier).
remap.fixPackageAccess=true
# Package access alone is not enough for 1.12.2: protected members used on another instance from a
# subclass now in another package fail verification, so protected members are made public as well.
remap.publicProtected=true
