// ghast oracle: runs the real vanilla movement code headless and writes golden vectors.
//
// The Minecraft version is a parameter: -Pmc=1.8.9 (default). Everything version-specific comes from
// versions/<mc>.properties; the harness for a version lives in its own source set (src/mc_x_y_z) and is
// compiled against the jar that `prepareVanilla` downloads and remaps into cache/<mc>/ (git-ignored).
//
// Tasks:
//   prepareVanilla   download client jar + libraries + mappings (SHA-1 checked), remap to Yarn names
//   oracle           run the harness CLI, e.g.  gradle oracle --args="golden"
//   decompile        (optional, local reading only) decompile the named jar into cache/<mc>/decompiled

plugins {
    id 'java'
}

def mcVersion = providers.gradleProperty('mc').getOrElse('1.8.9')
def versionFile = file("versions/${mcVersion}.properties")
if (!versionFile.exists()) {
    throw new GradleException("no oracle configuration for Minecraft ${mcVersion} (${versionFile})")
}
def versionProps = new Properties()
versionFile.withReader('UTF-8') { versionProps.load(it) }
def harnessSetName = versionProps.getProperty('harness.sourceSet')
def harnessMain = versionProps.getProperty('harness.mainClass')
def cacheRoot = file('cache')
def cacheDir = file("cache/${mcVersion}")
def namedJar = file("cache/${mcVersion}/client-${versionProps.getProperty('mappings.to')}.jar")
def classpathTxt = file("cache/${mcVersion}/classpath.txt")

// Library jars listed by prepareVanilla; resolved lazily so configuration works before the first fetch.
def vanillaFiles = files({
    def list = [namedJar]
    if (classpathTxt.exists()) {
        list.addAll(classpathTxt.readLines('UTF-8').findAll { !it.isBlank() }.collect { new File(it) })
    }
    list
})

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

sourceSets {
    setup
    common
    create(harnessSetName) {
        compileClasspath += sourceSets.common.output + vanillaFiles
        runtimeClasspath += sourceSets.common.output + vanillaFiles
    }
}

configurations {
    decompiler
}

dependencies {
    setupImplementation 'net.fabricmc:tiny-remapper:0.11.1'
    setupImplementation 'com.google.code.gson:gson:2.11.0'
    decompiler 'org.vineflower:vineflower:1.11.2'
}

def prepareVanilla = tasks.register('prepareVanilla', JavaExec) {
    group = 'oracle'
    description = "Download and remap Minecraft ${mcVersion} into cache/ (idempotent, SHA-1 checked)."
    classpath = sourceSets.setup.runtimeClasspath
    mainClass = 'ghast.oracle.setup.Setup'
    args 'prepare', versionFile.absolutePath, cacheRoot.absolutePath
    maxHeapSize = '1g'
}

tasks.named("compile${harnessSetName.capitalize()}Java") {
    dependsOn prepareVanilla
}

tasks.register('oracle', JavaExec) {
    group = 'oracle'
    description = "Run the ${mcVersion} oracle CLI (use --args=\"help\")."
    dependsOn prepareVanilla
    classpath = sourceSets.getByName(harnessSetName).runtimeClasspath
    mainClass = harnessMain
    workingDir = projectDir
    maxHeapSize = '1g'
    // Makes the run independent of the host's locale / timezone defaults.
    jvmArgs '-Duser.language=en', '-Duser.country=US', '-Duser.timezone=UTC', '-Dfile.encoding=UTF-8',
            '-Dlog4j.configurationFile=' + file('log4j2-quiet.xml').absolutePath
    systemProperty 'ghast.oracle.version', mcVersion
    systemProperty 'ghast.oracle.repoRoot', rootDir.parentFile.absolutePath
}

tasks.register('coverage', JavaExec) {
    group = 'oracle'
    description = 'Regenerate YARN_COVERAGE.md from the downloaded mappings.'
    dependsOn prepareVanilla
    classpath = sourceSets.setup.runtimeClasspath
    mainClass = 'ghast.oracle.setup.Coverage'
    // 1.8.9 keeps the original file name; later versions get a suffix.
    def report = mcVersion == '1.8.9' ? 'YARN_COVERAGE.md' : "YARN_COVERAGE_${mcVersion}.md"
    args file("cache/${mcVersion}/mappings/mappings.tiny").absolutePath, file(report).absolutePath,
            "${versionProps.getProperty('mappings.group')}:${versionProps.getProperty('mappings.artifact')}:${versionProps.getProperty('mappings.version')}:${versionProps.getProperty('mappings.classifier')}",
            file("versions/${mcVersion}.coverage").absolutePath, mcVersion, versionProps.getProperty('mappings.vendor', 'Legacy Fabric')
}

tasks.register('decompile', JavaExec) {
    group = 'oracle'
    description = 'Decompile the named jar into cache/<mc>/decompiled for local reading (never commit it).'
    dependsOn prepareVanilla
    classpath = configurations.decompiler
    mainClass = 'org.jetbrains.java.decompiler.main.decompiler.ConsoleDecompiler'
    maxHeapSize = '2g'
    doFirst {
        def out = new File(cacheDir, 'decompiled')
        out.mkdirs()
        def libArgs = classpathTxt.readLines('UTF-8').findAll { !it.isBlank() }.collect { "-e=${it}" }
        args(['-dgs=1', '-rsy=1', '-log=WARN'] + libArgs + [namedJar.absolutePath, out.absolutePath])
    }
}

tasks.register('printClasspath') {
    doLast { println sourceSets.getByName(harnessSetName).runtimeClasspath.asPath }
}
