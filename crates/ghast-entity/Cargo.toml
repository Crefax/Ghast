[package]
name = "ghast-entity"
description = "Entity tracking for the ghast Minecraft Java Edition client library: zero-allocation parsing of 1.8.9, 1.12.2 and 1.16.5 entity packets, vanilla-exact server positions, O(1) lookup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["minecraft", "entity", "bot"]
categories = ["game-development"]
readme = "README.md"
documentation = "https://docs.rs/ghast-entity"

[features]
default = ["v1_8", "v1_12", "v1_16_5"]
# One tracker per version (with its protocol and data tables); any subset builds.
v1_8 = ["ghast-protocol/v1_8", "ghast-data/v1_8"]
v1_12 = ["ghast-protocol/v1_12_2", "ghast-data/v1_12"]
v1_16_5 = ["ghast-protocol/v1_16_5", "ghast-data/v1_16_5"]

[dependencies]
ghast-protocol = { path = "../ghast-protocol", version = "0.3.0", default-features = false }
ghast-data = { path = "../ghast-data", version = "0.3.0", default-features = false }
bytes = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
ghast-protocol = { path = "../ghast-protocol", default-features = false, features = ["v1_8", "v1_12_2", "v1_16_5", "testgen"] }
ghast-data = { path = "../ghast-data", default-features = false, features = ["v1_8", "v1_12", "v1_16_5"] }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "entity"
harness = false
required-features = ["v1_8", "v1_12", "v1_16_5"]

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "v1_8"
required-features = ["v1_8"]

[[test]]
name = "v1_12"
required-features = ["v1_12"]

[[test]]
name = "v1_16_5"
required-features = ["v1_16_5"]

[[test]]
name = "robustness"
required-features = ["v1_8", "v1_12", "v1_16_5"]

[[example]]
name = "live_probe"
required-features = ["v1_8", "v1_12", "v1_16_5"]
