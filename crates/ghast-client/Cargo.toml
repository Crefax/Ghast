[package]
name = "ghast-client"
description = "Headless Minecraft Java Edition client for the ghast library: connection, login, fixed 50 ms tick loop and a version-agnostic bot API (1.8.9, 1.12.2, 1.16.5 and 26.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["minecraft", "bot", "client", "headless"]
categories = ["game-development", "network-programming"]
readme = "README.md"
documentation = "https://docs.rs/ghast-client"

[features]
default = ["v1_8", "v1_12_2", "v1_16_5", "v26_1", "libdeflate", "display-names"]
# Game versions (each one alone builds; drop the ones you do not connect with to cut compile
# time and binary size). A `GameVersion` whose feature is off still exists, but running it
# returns `ClientError::VersionNotEnabled`.
v1_8 = ["ghast-protocol/v1_8", "ghast-world/v1_8", "ghast-data/v1_8", "ghast-physics/v1_8", "ghast-inventory/v1_8", "ghast-entity/v1_8"]
v1_12_2 = ["ghast-protocol/v1_12_2", "ghast-world/v1_12", "ghast-data/v1_12", "ghast-physics/v1_12", "ghast-inventory/v1_12", "ghast-entity/v1_12"]
v1_16_5 = ["ghast-protocol/v1_16_5", "ghast-world/v1_16_5", "ghast-data/v1_16_5", "ghast-physics/v1_16_5", "ghast-inventory/v1_16_5", "ghast-entity/v1_16_5"]
v26_1 = ["ghast-protocol/v26_1", "ghast-world/v26_1", "ghast-data/v26_1", "ghast-physics/v26_1", "ghast-inventory/v26_1", "ghast-entity/v26_1"]
# English display names of blocks, items, entities, biomes, enchantments and effects in
# ghast-data (`display_name` fields); registry names are always there. Off saves ~120–200 KB.
display-names = ["ghast-data/display-names"]
# Inflate / deflate packets with libdeflate (C, faster); off = pure Rust (flate2 + zlib-rs).
libdeflate = ["ghast-protocol/libdeflate"]
# Online-mode servers: Microsoft account sessions and the session-server join call.
microsoft = ["ghast-auth/microsoft"]

[dependencies]
ghast-protocol = { path = "../ghast-protocol", version = "0.4.0", default-features = false, features = ["tokio", "chat-json"] }
ghast-auth = { path = "../ghast-auth", version = "0.4.0" }
ghast-world = { path = "../ghast-world", version = "0.4.0", default-features = false, features = ["physics"] }
ghast-physics = { path = "../ghast-physics", version = "0.4.0", default-features = false }
ghast-inventory = { path = "../ghast-inventory", version = "0.4.0", default-features = false }
ghast-entity = { path = "../ghast-entity", version = "0.4.0", default-features = false }
ghast-data = { path = "../ghast-data", version = "0.4.0", default-features = false }
bytes = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt"] }

[dev-dependencies]
ghast-data = { path = "../ghast-data", version = "0.4.0" }
flate2 = { workspace = true }
serde_json = { workspace = true }
ghast-protocol = { path = "../ghast-protocol", version = "0.4.0" }
tokio = { workspace = true, features = ["net", "io-util", "time", "macros", "rt", "rt-multi-thread", "test-util"] }

[package.metadata.docs.rs]
all-features = true

# The integration tests drive the old versions.
[[test]]
name = "fake_server"
required-features = ["v1_8", "v1_12_2", "v1_16_5"]

[[test]]
name = "oracle_raytrace"
required-features = ["v1_8"]

[[test]]
name = "cpu"
required-features = ["v1_8"]

