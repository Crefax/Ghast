[package]
name = "ghast-viewer"
description = "Bot screen for ghast bots: a live 3D view of the bot's world in the browser, with recordings and replays"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["minecraft", "bot", "viewer", "replay"]
categories = ["game-development", "visualization"]
readme = "README.md"
documentation = "https://docs.rs/ghast-viewer"
include = ["/src/**", "/web/dist/**", "/docs/**", "/examples/**", "/tests/**", "/README.md", "/INTEGRATION.md", "/LICENSE-*", "/Cargo.toml"]

[features]
default = ["download", "v26_1", "v26_2"]
# 26.1 sessions (drawn with the 1.8 assets: blocks, items and entities mapped to 1.8 look-alikes).
# Without it a 26.1 session shows a notice instead of the world.
v26_1 = ["ghast-data/v26_1"]
# 26.2 sessions, drawn like 26.1 ones.
v26_2 = ["ghast-data/v26_2"]
# Fetch the vanilla client jar (for textures and models) from Mojang's version manifest when no
# jar is configured. Without it, `ViewerConfig::client_jar` must point at a local copy.
download = ["dep:ureq"]

[dependencies]
ghast-client = { path = "../ghast-client", version = "0.4.2", default-features = false }
ghast-entity = { path = "../ghast-entity", version = "0.4.2" }
ghast-protocol = { path = "../ghast-protocol", version = "0.4.2", default-features = false, features = ["v1_8", "v1_16_5"] }
ghast-world = { path = "../ghast-world", version = "0.4.2", default-features = false, features = ["v1_8", "v1_16_5"] }
ghast-inventory = { path = "../ghast-inventory", version = "0.4.2" }
ghast-data = { path = "../ghast-data", version = "0.4.2", default-features = false, features = ["v1_8", "display-names"] }
bytes = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "ws", "query"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
flate2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
log = { workspace = true }
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }

[dev-dependencies]
ghast-client = { path = "../ghast-client", version = "0.4.2" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[package.metadata.docs.rs]
all-features = true
