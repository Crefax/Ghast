[package]
name = "ghast-world"
description = "Chunk storage for the ghast Minecraft Java Edition client library: compact, O(1) block lookup, explicit loaded/unloaded columns, decoding of 1.8.9, 1.12.2 and 1.16.5 chunk and block-change packets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["minecraft", "chunk", "world", "bot"]
categories = ["game-development", "data-structures"]
readme = "README.md"
documentation = "https://docs.rs/ghast-world"

[features]
default = ["v1_8", "v1_12", "v1_16_5", "v26_1", "v26_2", "physics"]
# Per-version worlds (chunk formats and packet handling).
v1_8 = ["ghast-protocol/v1_8", "ghast-data/v1_8"]
v1_12 = ["ghast-protocol/v1_12_2", "ghast-data/v1_12"]
v1_16_5 = ["ghast-protocol/v1_16_5", "ghast-data/v1_16_5"]
v26_1 = ["ghast-protocol/v26_1", "ghast-data/v26_1", "ghast-physics?/v26_1"]
# 26.2: the 26.1 world source over the 26.2 data and packets (the physics view uses the modern
# core's border, which ghast-physics builds with its `v26_1` feature).
v26_2 = ["ghast-protocol/v26_2", "ghast-data/v26_2", "ghast-physics?/v26_1"]
# Implements `ghast_physics::BlockView` for the worlds.
physics = ["dep:ghast-physics"]

[dependencies]
ghast-protocol = { path = "../ghast-protocol", version = "0.4.2", default-features = false }
ghast-data = { path = "../ghast-data", version = "0.4.2", default-features = false }
ghast-physics = { path = "../ghast-physics", version = "0.4.2", optional = true, default-features = false }
bytes = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
flate2 = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "world"
harness = false
required-features = ["v1_8", "v1_16_5"]

[[bench]]
name = "world_26_1"
harness = false
required-features = ["v26_1", "physics"]

[[example]]
name = "chunk_stats_26_1"
required-features = ["v26_1"]

[[example]]
name = "probe_26_1"
required-features = ["v26_1"]

[package.metadata.docs.rs]
all-features = true
