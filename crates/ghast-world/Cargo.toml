[package]
name = "ghast-world"
description = "Chunk storage for the ghast Minecraft Java Edition client library: compact, O(1) block lookup, explicit loaded/unloaded columns, decoding of 1.8.9 and 1.16.5 chunk and block-change packets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["minecraft", "chunk", "world", "bot"]
categories = ["game-development", "data-structures"]
readme = "README.md"
documentation = "https://docs.rs/ghast-world"

[features]
default = ["v1_8", "v1_16_5", "physics"]
# Per-version worlds (chunk formats and packet handling).
v1_8 = ["ghast-protocol/v1_8", "ghast-data/v1_8"]
v1_16_5 = ["ghast-protocol/v1_16_5", "ghast-data/v1_16_5"]
# Implements `ghast_physics::BlockView` for the worlds.
physics = ["dep:ghast-physics"]

[dependencies]
ghast-protocol = { path = "../ghast-protocol", version = "0.1.2", default-features = false }
ghast-data = { path = "../ghast-data", version = "0.1.2", default-features = false }
ghast-physics = { path = "../ghast-physics", version = "0.1.2", optional = true }
bytes = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "world"
harness = false
required-features = ["v1_8", "v1_16_5"]

[package.metadata.docs.rs]
all-features = true
