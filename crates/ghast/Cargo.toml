[package]
name = "ghast"
description = "Headless Minecraft Java Edition client / bot library (1.8.9 and 1.16.5) with vanilla-exact behaviour: facade crate re-exporting the ghast-* crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["minecraft", "bot", "client", "headless", "protocol"]
categories = ["game-development", "network-programming"]
readme = "README.md"
documentation = "https://docs.rs/ghast"

[features]
default = []
# Online-mode servers (Microsoft accounts).
microsoft = ["ghast-client/microsoft", "ghast-auth/microsoft"]
# `ghast::ext`: sequential async helpers (look, dig, place, equip, containers, chat, events).
ext = ["dep:ghast-ext"]
# `ghast::pathfinder`: physics-validated path planning and following (and `ext`'s `goto`).
pathfinder = ["dep:ghast-pathfinder", "ghast-ext?/pathfinder"]
# `ghast::viewer`: the bot screen (a live 3D view of the bot's world in the browser, recordings
# and replays). Textures are fetched from Mojang's client jar at run time.
viewer = ["dep:ghast-viewer"]

[dependencies]
ghast-client = { path = "../ghast-client", version = "0.2.3" }
ghast-protocol = { path = "../ghast-protocol", version = "0.2.3" }
ghast-auth = { path = "../ghast-auth", version = "0.2.3" }
ghast-data = { path = "../ghast-data", version = "0.2.3" }
ghast-ext = { path = "../ghast-ext", version = "0.2.3", optional = true, default-features = false }
ghast-pathfinder = { path = "../ghast-pathfinder", version = "0.2.3", optional = true }
ghast-viewer = { path = "../ghast-viewer", version = "0.2.3", optional = true }

[dev-dependencies]
log = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "signal", "time", "io-std", "io-util", "sync", "net"] }

[[example]]
name = "afk"

[[example]]
name = "chat"

[[example]]
name = "movement_course"

[[example]]
name = "dig_place"

[[example]]
name = "use_item"

[[example]]
name = "soak"

[[example]]
name = "attack"

[[example]]
name = "inventory_probe"

[[example]]
name = "goto"
required-features = ["ext", "pathfinder"]

[package.metadata.docs.rs]
all-features = true
