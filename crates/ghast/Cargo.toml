[package]
name = "ghast"
description = "Headless Minecraft Java Edition client / bot library (1.8.9, 1.12.2, 1.16.5, 26.1 and 26.2) with vanilla-exact behaviour: facade crate re-exporting the ghast-* crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["minecraft", "bot", "client", "headless", "protocol"]
categories = ["game-development", "network-programming"]
readme = "README.md"
documentation = "https://docs.rs/ghast"

[features]
default = ["v1_8", "v1_12_2", "v1_16_5", "v26_1", "v26_2", "libdeflate", "display-names"]
# Game versions. Each one builds alone; drop the ones you never connect with to cut compile
# time and binary size (`cargo add ghast --no-default-features --features v1_8,libdeflate`).
v1_8 = ["ghast-client/v1_8", "ghast-protocol/v1_8", "ghast-data/v1_8", "ghast-ext?/v1_8", "ghast-pathfinder?/v1_8"]
v1_12_2 = ["ghast-client/v1_12_2", "ghast-protocol/v1_12_2", "ghast-data/v1_12", "ghast-ext?/v1_12_2", "ghast-pathfinder?/v1_12_2"]
v1_16_5 = ["ghast-client/v1_16_5", "ghast-protocol/v1_16_5", "ghast-data/v1_16_5", "ghast-ext?/v1_16_5", "ghast-pathfinder?/v1_16_5"]
v26_1 = ["ghast-client/v26_1", "ghast-protocol/v26_1", "ghast-data/v26_1", "ghast-ext?/v26_1", "ghast-pathfinder?/v26_1", "ghast-viewer?/v26_1"]
v26_2 = ["ghast-client/v26_2", "ghast-protocol/v26_2", "ghast-data/v26_2", "ghast-ext?/v26_2", "ghast-pathfinder?/v26_2", "ghast-viewer?/v26_2"]
# English display names in ghast-data (`display_name` fields); registry names are always there.
display-names = ["ghast-client/display-names", "ghast-data/display-names"]
# Packet compression with libdeflate (C, faster); without it pure Rust (flate2 + zlib-rs).
libdeflate = ["ghast-client/libdeflate"]
# Online-mode servers (Microsoft accounts).
microsoft = ["ghast-client/microsoft", "ghast-auth/microsoft"]
# `ghast::ext`: sequential async helpers (look, dig, place, equip, containers, chat, events).
ext = ["dep:ghast-ext"]
# `ghast::pathfinder`: physics-validated path planning and following (and `ext`'s `goto`);
# 1.8.9, 1.12.2, 1.16.5, 26.1 and 26.2.
pathfinder = ["dep:ghast-pathfinder", "ghast-ext?/pathfinder"]
# `ghast::viewer`: the bot screen (a live 3D view of the bot's world in the browser, recordings
# and replays). Textures are fetched from Mojang's client jar at run time.
viewer = ["dep:ghast-viewer"]

[dependencies]
ghast-client = { path = "../ghast-client", version = "0.4.3", default-features = false }
ghast-protocol = { path = "../ghast-protocol", version = "0.4.3", default-features = false, features = ["tokio"] }
ghast-auth = { path = "../ghast-auth", version = "0.4.3" }
ghast-data = { path = "../ghast-data", version = "0.4.3", default-features = false }
ghast-ext = { path = "../ghast-ext", version = "0.4.3", optional = true, default-features = false }
ghast-pathfinder = { path = "../ghast-pathfinder", version = "0.4.3", optional = true, default-features = false, features = ["client"] }
ghast-viewer = { path = "../ghast-viewer", version = "0.4.3", optional = true, default-features = false, features = ["download"] }

[dev-dependencies]
log = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "signal", "time", "io-std", "io-util", "sync", "net"] }

[[test]]
name = "observer"
required-features = ["v1_8"]

[[example]]
name = "afk"

[[example]]
name = "chat"

[[example]]
name = "movement_course"

[[example]]
name = "dig_place"

[[example]]
name = "use_item"

[[example]]
name = "soak"

[[example]]
name = "attack"

[[example]]
name = "inventory_probe"

[[example]]
name = "server_switch"

[[example]]
name = "elytra_flight"

[[example]]
name = "creative_probe"
required-features = ["v26_1"]

[[example]]
name = "entity_probe"
required-features = ["v26_1"]

[[example]]
name = "dialog"

[[example]]
name = "online_chat"
required-features = ["microsoft"]

[[example]]
name = "goto"
required-features = ["ext", "pathfinder"]

[package.metadata.docs.rs]
all-features = true
