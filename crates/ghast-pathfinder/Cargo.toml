[package]
name = "ghast-pathfinder"
description = "Physics-exact path planning and path following for the ghast Minecraft Java Edition bot library (1.8.9, 1.12.2, 1.16.5 and 26.1): every move type is validated against the vanilla-exact ghast-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["minecraft", "pathfinding", "bot", "astar", "physics"]
categories = ["game-development", "algorithms"]
documentation = "https://docs.rs/ghast-pathfinder"
readme = "README.md"

[features]
default = ["client", "v1_8", "v1_12_2", "v1_16_5", "v26_1", "v26_2"]
# `Follower`: drives a path from a `ghast_client::Behavior` through `TickContext`.
client = ["dep:ghast-client", "dep:log"]
# One feature per supported game version (forwarded to ghast-data, ghast-physics and, with
# `client`, ghast-client).
v1_8 = ["ghast-data/v1_8", "ghast-physics/v1_8", "ghast-client?/v1_8"]
v1_12_2 = ["ghast-data/v1_12", "ghast-physics/v1_12", "ghast-client?/v1_12_2"]
v1_16_5 = ["ghast-data/v1_16_5", "ghast-physics/v1_16_5", "ghast-client?/v1_16_5"]
v26_1 = ["ghast-data/v26_1", "ghast-physics/v26_1", "ghast-client?/v26_1"]
v26_2 = ["ghast-data/v26_2", "ghast-physics/v26_2", "ghast-client?/v26_2"]

[dependencies]
ghast-data = { path = "../ghast-data", version = "0.4.1", default-features = false }
ghast-physics = { path = "../ghast-physics", version = "0.4.1", default-features = false }
ghast-client = { path = "../ghast-client", version = "0.4.1", optional = true, default-features = false }
log = { workspace = true, optional = true }

[dev-dependencies]
ghast-client = { path = "../ghast-client", version = "0.4.1" }
proptest = { workspace = true }
criterion = { workspace = true }

# The integration tests and the bench run every version.
[[bench]]
name = "plan"
harness = false
required-features = ["v1_8", "v1_12_2", "v1_16_5", "v26_1", "v26_2"]

[[test]]
name = "incremental"
required-features = ["v1_8", "v1_12_2", "v1_16_5", "v26_1", "v26_2"]

[[test]]
name = "maze"
required-features = ["v1_8", "v1_12_2", "v1_16_5", "v26_1", "v26_2"]

[[test]]
name = "parkour"
required-features = ["v1_8", "v1_12_2", "v1_16_5", "v26_1", "v26_2"]

[[test]]
name = "validation"
required-features = ["v1_8", "v1_12_2", "v1_16_5", "v26_1", "v26_2"]

[package.metadata.docs.rs]
all-features = true
